name: Build production images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-image-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_SEBAS }}
          password: ${{ secrets.DOCKER_PASSWORD_SEBAS }}
      - uses: oras-project/setup-oras@v1
      - name: Build and publish manifest
        env:
          DOCKER_HUB_REGISTRY_SEBAS: ${{ vars.DOCKER_HUB_REGISTRY_SEBAS }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME_SEBAS }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_SEBAS }}
          VITE_AUTH_BACKEND_URL: ${{ vars.VITE_AUTH_BACKEND_URL }}
          MANIFEST_BOOTSTRAP: ${{ vars.MANIFEST_BOOTSTRAP }}
        run: python3 scripts/publish_images.py
