include:
  - docker/compose.dependencies.yml

services:
  auth-service:
    build:
      context: ./auth_service
      target: dev
    ports:
      - "8000:8000"
    environment:
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL:-https://keycloack.dfcubidesc.com}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-auth-service}
      - KEYCLOAK_REALM_NAME=${KEYCLOAK_REALM_NAME:-habit-tracker}
      - KEYCLOAK_REDIRECT_URI=${KEYCLOAK_REDIRECT_URI:-http://localhost:8002/auth/login}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - REDIS_HOST=${REDIS_HOST:-redis-cache}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-auth-service}
      - OTEL_EXPORTER_LOGS_ENDPOINT=${OTEL_EXPORTER_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
    secrets:
      - keycloak_client_secret_key
      - redis_password
    depends_on:
      redis-cache:
        condition: service_started
    volumes:
      - ./auth_service:/app

  vacation-planner:
    build:
      context: ./vacation_stay_scrapper
      target: dev
    ports:
      - "8001:8000"
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_USER=${DATABASE_USER:-vacation}
      - DATABASE_NAME=${DATABASE_NAME:-vacation_planner}
      - DATABASE_ECHO=${DATABASE_ECHO:-false}
      - MIN_DELAY_ATTEMPT=${MIN_DELAY_ATTEMPT:-60}
      - MIN_FAILURE_ATTEMPTS=${MIN_FAILURE_ATTEMPTS:-3}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-https://keycloack.dfcubidesc.com}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-habit-tracker}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-habit-tracker-frontend}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=${LOG_FILE:-}
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_started
      auth-service:
        condition: service_started
    volumes:
      - ./vacation_stay_scrapper:/vacation_stay_scrapper

  flight-service:
    build:
      context: ./flight_service
      target: dev
    environment:
      - SERVER=${SERVER:-rest}
    secrets:
      - redis_password
    ports:
      - "8002:8080"
    volumes:
      - ./flight_service:/flight_service
    depends_on:
      auth-service:
        condition: service_started

  recommendations:
    build:
      context: ./recommendations

  fe-client:
    build:
      context: ./fe-client
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./fe-client/src:/app/src
      - ./fe-client/index.html:/app/index.html
      - ./fe-client/vite.config.js:/app/vite.config.js

secrets:
  keycloak_client_secret_key:
    file: ./secrets/keycloak_client_secret_key
  redis_password:
    file: ./secrets/redis_password
  postgres_password:
    file: ./secrets/postgres_password
